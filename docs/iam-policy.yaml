# Amazon Quick Observability Platform — Terraform deployer policy baseline
#
# Scope
# -----
# This policy is for the identity running the Terraform configuration in
# `terraform/`. It intentionally excludes permissions used at runtime by the
# provisioner Lambda, snapshot Lambda, transform/streaming roles, and QuickSight
# service role; Terraform installs those runtime inline policies with
# iam:PutRolePolicy.
#
# Security review requirements
# ----------------------------
# - Resource "*" is used where resources do not exist before first deployment
#   or the AWS API/provider requires it. Replace it with approved account,
#   Region, resource-prefix, bucket, key, role, and stack ARN patterns wherever
#   your provisioning workflow makes those values known.
# - In particular, scope IAM role-management and PassRole resources to the seven
#   generated roles.
# - Retain the iam:PassedToService condition on PassRole.
# - Apply SCPs, permission boundaries, session policies, and tag conditions
#   required by your organization.
# - This baseline was reconciled with AWS provider 6.33.0. Revalidate denied
#   CloudTrail events after provider upgrades and before production approval.
#
# See REQUIRED_PERMISSIONS.txt for trust-boundary and runtime-role details.

Version: "2012-10-17"
Statement:
  - Sid: CallerIdentity
    Effect: Allow
    Action:
      - sts:GetCallerIdentity
    Resource: "*"

  # Terraform manages one small stack containing two Lambda custom resources.
  # DescribeStackEvents is used by provider failure diagnostics.
  - Sid: CloudFormationLifecycleBridge
    Effect: Allow
    Action:
      - cloudformation:CreateStack
      - cloudformation:DeleteStack
      - cloudformation:DescribeStackEvents
      - cloudformation:DescribeStacks
      - cloudformation:GetTemplate
      - cloudformation:UpdateStack
    Resource: "*"

  - Sid: KmsKeyLifecycle
    Effect: Allow
    Action:
      - kms:CancelKeyDeletion
      - kms:CreateAlias
      - kms:CreateKey
      - kms:DeleteAlias
      - kms:DescribeKey
      - kms:EnableKeyRotation
      - kms:GetKeyPolicy
      - kms:GetKeyRotationStatus
      - kms:ListAliases
      - kms:ListResourceTags
      - kms:PutKeyPolicy
      - kms:ScheduleKeyDeletion
      - kms:TagResource
      - kms:UntagResource
      - kms:UpdateAlias
    Resource: "*"

  - Sid: CloudWatchLogsAndDelivery
    Effect: Allow
    Action:
      - logs:AssociateKmsKey
      - logs:CreateDelivery
      - logs:CreateLogGroup
      - logs:DeleteDelivery
      - logs:DeleteDeliveryDestination
      - logs:DeleteDeliverySource
      - logs:DeleteLogGroup
      - logs:DeleteRetentionPolicy
      - logs:DeleteSubscriptionFilter
      - logs:DescribeDeliveries
      - logs:DescribeLogGroups
      - logs:DescribeSubscriptionFilters
      - logs:DisassociateKmsKey
      - logs:GetDelivery
      - logs:GetDeliveryDestination
      - logs:GetDeliverySource
      - logs:ListTagsForResource
      - logs:PutDeliveryDestination
      - logs:PutDeliverySource
      - logs:PutRetentionPolicy
      - logs:PutSubscriptionFilter
      - logs:TagResource
      - logs:UntagResource
    Resource: "*"

  - Sid: QuickVendedLogAuthorization
    Effect: Allow
    Action:
      - quicksight:AllowVendedLogDeliveryForResource
    Resource: "*"

  # The pinned provider's aws_s3_bucket read path queries legacy bucket
  # attributes even though this configuration manages most settings with
  # dedicated resources. Force-destroy actions are inert unless the guarded
  # teardown procedure is explicitly enabled.
  - Sid: S3BucketLifecycle
    Effect: Allow
    Action:
      - s3:AbortMultipartUpload
      - s3:CreateBucket
      - s3:DeleteBucket
      - s3:DeleteBucketEncryption
      - s3:DeleteBucketPolicy
      - s3:DeleteBucketTagging
      - s3:DeleteObject
      - s3:DeleteObjectVersion
      - s3:DeletePublicAccessBlock
      - s3:GetBucketAccelerateConfiguration
      - s3:GetBucketAcl
      - s3:GetBucketCORS
      - s3:GetBucketLocation
      - s3:GetBucketLogging
      - s3:GetBucketObjectLockConfiguration
      - s3:GetBucketPolicy
      - s3:GetBucketPublicAccessBlock
      - s3:GetBucketRequestPayment
      - s3:GetBucketTagging
      - s3:GetBucketVersioning
      - s3:GetBucketWebsite
      - s3:GetEncryptionConfiguration
      - s3:GetLifecycleConfiguration
      - s3:GetReplicationConfiguration
      - s3:ListBucket
      - s3:ListBucketMultipartUploads
      - s3:ListBucketVersions
      - s3:ListMultipartUploadParts
      - s3:PutBucketPolicy
      - s3:PutBucketPublicAccessBlock
      - s3:PutBucketTagging
      - s3:PutBucketVersioning
      - s3:PutEncryptionConfiguration
      - s3:TagResource
    Resource: "*"

  - Sid: LambdaFunctionLifecycle
    Effect: Allow
    Action:
      - lambda:AddPermission
      - lambda:CreateFunction
      - lambda:DeleteFunction
      - lambda:GetFunction
      - lambda:GetFunctionCodeSigningConfig
      - lambda:GetFunctionConcurrency
      - lambda:GetPolicy
      - lambda:GetRuntimeManagementConfig
      - lambda:ListTags
      - lambda:ListVersionsByFunction
      - lambda:RemovePermission
      - lambda:TagResource
      - lambda:UntagResource
      - lambda:UpdateFunctionCode
      - lambda:UpdateFunctionConfiguration
    Resource: "*"

  - Sid: FirehoseDeliveryStreams
    Effect: Allow
    Action:
      - firehose:CreateDeliveryStream
      - firehose:DeleteDeliveryStream
      - firehose:DescribeDeliveryStream
      - firehose:ListTagsForDeliveryStream
      - firehose:TagDeliveryStream
      - firehose:UntagDeliveryStream
      - firehose:UpdateDestination
    Resource: "*"

  - Sid: EventBridgeRulesAndTargets
    Effect: Allow
    Action:
      - events:DeleteRule
      - events:DescribeRule
      - events:ListTagsForResource
      - events:ListTargetsByRule
      - events:PutRule
      - events:PutTargets
      - events:RemoveTargets
      - events:TagResource
      - events:UntagResource
    Resource: "*"

  # Terraform creates seven roles and manages only inline role policies,
  # including a scoped QuickSight Athena data-source run-as role.
  - Sid: IamRoleAndInlinePolicyLifecycle
    Effect: Allow
    Action:
      - iam:CreateRole
      - iam:DeleteRole
      - iam:DeleteRolePolicy
      - iam:GetRole
      - iam:GetRolePolicy
      - iam:ListAttachedRolePolicies
      - iam:ListInstanceProfilesForRole
      - iam:ListRolePolicies
      - iam:ListRoleTags
      - iam:PutRolePolicy
      - iam:TagRole
      - iam:UntagRole
      - iam:UpdateAssumeRolePolicy
    Resource: "*"

  - Sid: PassGeneratedServiceRoles
    Effect: Allow
    Action:
      - iam:PassRole
    Resource: "*"
    Condition:
      StringEquals:
        iam:PassedToService:
          - events.amazonaws.com
          - firehose.amazonaws.com
          - lambda.amazonaws.com
          - logs.amazonaws.com

  - Sid: AthenaWorkgroupLifecycle
    Effect: Allow
    Action:
      - athena:CreateWorkGroup
      - athena:DeleteWorkGroup
      - athena:GetWorkGroup
      - athena:ListTagsForResource
      - athena:TagResource
      - athena:UntagResource
      - athena:UpdateWorkGroup
    Resource: "*"
